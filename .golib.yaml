schema_version: 1
tool_version: v1.3.0
tool_checksums_sha256: 72d38d7d0cab33bfeb9345df6b141eacf9841c5d6817f597ff25b957dc8dc48f
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
mutation:
  root: ".verification/mutation"
  imports:
  - module: "."
    archive: ".verification/mutation/bootstrap/root.zip"
    ledger: ".verification/mutation/migration-ledger.json"
  - module: adapters/golib
    archive: ".verification/mutation/bootstrap/adapters-golib.zip"
    ledger: ".verification/mutation/migration-ledger.json"
api:
  baselines:
  - module: "."
    mode: apidiff
    path: api/baseline.txt
  - module: adapters/golib
    mode: apidiff
    path: adapters/golib/api/baseline.txt
operations:
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages:
    - "."
    fuzz: '^FuzzDecodeJSON$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "."
    fuzz: '^FuzzDecodeJSONBatch$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "."
    fuzz: '^FuzzDecodeHTTP$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "."
    fuzz: '^FuzzDecodeKafka$'
    budget: 100x
    timeout: 2m
- module: "."
  gate: benchmark
  steps:
  - type: go-test
    packages:
    - "./..."
    benchmark: "."
    budget: 100ms
    timeout: 20m
- module: adapters/golib
  gate: fuzz
  steps:
  - type: go-test
    packages:
    - "."
    fuzz: '^FuzzDecodeKafka$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "."
    fuzz: '^FuzzQueuePayloadRoundTrip$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "."
    fuzz: '^FuzzEventSourcingRoundTrip$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "."
    fuzz: '^FuzzOutboxRoundTrip$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "."
    fuzz: '^FuzzWorkflowRoundTrip$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "."
    fuzz: '^FuzzAuditCorrelationTenantMetadata$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "."
    fuzz: '^FuzzDirectJSONSchemaValidation$'
    budget: 100x
    timeout: 2m
- module: adapters/golib
  gate: benchmark
  steps:
  - type: go-test
    packages:
    - "./..."
    benchmark: "."
    budget: 100ms
    timeout: 20m
- module: "."
  gate: conformance
  steps:
  - type: make
    makefile: verification/package.mk
    target: conformance
    timeout: 20m
- module: "."
  gate: interoperability
  steps:
  - type: make
    makefile: verification/package.mk
    target: interoperability
    timeout: 20m
